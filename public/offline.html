<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a2540">
    <meta name="author" content="Marcelo Brad - RJ — KDKHost Soluções">
    <title>Sem conexão · KDK Finance</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f7fb;
            color: #0f2234;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #dbe4ef;
            border-radius: 18px;
            padding: 36px 32px;
            box-shadow: 0 18px 40px rgba(15, 34, 52, .08);
            text-align: center;
        }
        .mark {
            display: inline-flex;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #0a2540, #163250);
            color: #f4f9ff;
            font-weight: 800;
            letter-spacing: .04em;
            margin-bottom: 18px;
        }
        h1 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -.02em; }
        p { margin: 0 0 20px; color: #5a7085; font-size: .92rem; line-height: 1.6; }
        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 20px;
            background: #0f9d76;
            color: #fff;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
        }
        small { display: block; margin-top: 22px; color: #8094a8; font-size: .7rem; }
    </style>
</head>
<body>
    <main class="card">
        <span class="mark">KDK</span>
        <h1>Você está sem conexão</h1>
        <p>Os dados financeiros precisam de internet para exibir as cotações mais recentes. Verifique sua rede e tente novamente.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <small>KDKHost Soluções · Desenvolvido por Marcelo Brad - RJ</small>
    </main>
</body>
</html>
